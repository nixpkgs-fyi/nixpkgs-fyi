<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · nixpkgs maintenance</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>
<header>
  <nav>
    <a class="brand" href="/">nixpkgs maintenance</a>
    <a href="/"{{if eq .Nav "packages"}} class="active"{{end}}>Packages</a>
    <a href="/maintainers"{{if eq .Nav "maintainers"}} class="active"{{end}}>Maintainers</a>
    <a href="/teams"{{if eq .Nav "teams"}} class="active"{{end}}>Teams</a>
  </nav>
  <div class="snapshot">
    {{with .Snap}}{{$m := .Meta}}
    {{if $m.channel}}{{$m.channel}} · {{end}}{{$m.system}} ·
    <a href="https://github.com/NixOS/nixpkgs/commit/{{$m.rev}}"><code>{{shortRev $m.rev}}</code></a> ·
    generated {{$m.generated_at}}
    {{end}}
    <button type="button" id="theme-switch" class="theme-switch" hidden></button>
  </div>
</header>
<main>
{{template "content" .}}
</main>
{{if .Banner}}
<footer>
  Built with ❤️ by <a href="https://github.com/pinpox">pinpox</a> ·
  <a href="https://github.com/nixpkgs-fyi/nixpkgs-fyi">source on GitHub</a>
</footer>
{{end}}
</body>
</html>
